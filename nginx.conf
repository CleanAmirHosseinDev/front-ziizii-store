# nginx.conf
server {
    listen 80;
    server_name ziizii-kids.com www.ziizii-kids.com;
    
    root /var/www/ziizii-frontend/build;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api {
        proxy_pass http://localhost:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}